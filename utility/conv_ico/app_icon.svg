<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#3a7bd5"/>
  <g>
    <!-- 左側: 画像ファイル（PNG/BMP/SVG） -->
    <rect x="32" y="72" width="64" height="96" rx="12" fill="#fff" stroke="#2d5fa7" stroke-width="3"/>
    <text x="64" y="130" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial" fill="#3a7bd5" font-weight="bold">IMG</text>
    <!-- 右側: アイコンファイル（ICO） -->
    <rect x="160" y="88" width="64" height="64" rx="16" fill="#fff" stroke="#2d5fa7" stroke-width="3"/>
    <text x="192" y="128" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial" fill="#3a7bd5" font-weight="bold">ICO</text>
    <!-- 変換の矢印 -->
    <polygon points="112,128 144,128 136,120 136,136" fill="#2d5fa7"/>
    <rect x="120" y="124" width="24" height="8" rx="4" fill="#2d5fa7"/>
  </g>
  <text x="128" y="220" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial" fill="#fff" opacity="0.8">Image → Icon Converter</text>
</svg>
